name: E2E

on:
  workflow_dispatch:   # manual trigger
  schedule:
    - cron: "0 4 * * 1"   # every Monday at 04:00 UTC

jobs:
  e2e:
    name: E2E on AVD
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant Gradle wrapper permissions
        run: |
          chmod +x gradlew
          chmod +x test-app/gradlew

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orbit-report/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: orbit-report

      - name: Build test-app APKs
        run: ./gradlew :composeApp:assembleDebug :composeApp:assembleDebugAndroidTest
        working-directory: test-app

      - name: Enable KVM (faster emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run E2E tests on AVD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          script: ./gradlew :orbit-runner:e2eTest

      - name: Upload orbit-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-report-e2e
          path: orbit-runner/build/e2e-output/orbit-report/
          retention-days: 14
