name: CI

on:
  push:
    branches: [ master, "release/**" ]
  pull_request:

jobs:
  test:
    name: Unit & Integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orbit-report/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: orbit-report

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Run integration tests
        run: ./gradlew integrationTest

      - name: Build shadow JAR
        run: ./gradlew shadowJar

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            orbit-runner/build/reports/tests/
            orbit-client/build/reports/tests/
          retention-days: 7
